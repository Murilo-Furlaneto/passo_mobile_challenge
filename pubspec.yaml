name: passo_mobile_challenge
description: Desafio mobile Flutter com Riverpod, GPS e sessões de corrida/caminhada.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  geolocator: ^14.1.2
  flutter_local_notifications: ^22.3.3
  intl: ^0.20.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
